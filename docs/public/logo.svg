<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43a047"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="116" rx="52" fill="#fff" opacity="0.06"/>

  <!-- Site list card -->
  <g filter="url(#shadow)">
    <rect x="44" y="50" width="152" height="148" rx="16" fill="#fafafa"/>
  </g>
  <rect x="44" y="50" width="152" height="26" rx="16" fill="#c8e6c9"/>
  <rect x="44" y="64" width="152" height="12" fill="#c8e6c9"/>
  <circle cx="60" cy="63" r="4.5" fill="#81c784"/>
  <circle cx="74" cy="63" r="4.5" fill="#a5d6a7"/>
  <circle cx="88" cy="63" r="4.5" fill="#a5d6a7"/>

  <!-- Rows: status dot + text bars -->
  <circle cx="66" cy="100" r="8" fill="#43a047"/>
  <rect x="82" y="94" width="72" height="12" rx="6" fill="#b0bec5"/>
  <circle cx="66" cy="132" r="8" fill="#43a047"/>
  <rect x="82" y="126" width="88" height="12" rx="6" fill="#b0bec5"/>
  <circle cx="66" cy="164" r="8" fill="#fb8c00"/>
  <rect x="82" y="158" width="60" height="12" rx="6" fill="#b0bec5"/>

  <!-- Check badge -->
  <g filter="url(#shadow)">
    <circle cx="186" cy="184" r="42" fill="url(#badge)"/>
  </g>
  <circle cx="186" cy="184" r="33" fill="#2e7d32"/>
  <path d="M170 185 l11 11 l22 -24" fill="none" stroke="#fff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
